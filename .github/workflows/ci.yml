name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Verify repository cleanliness
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.venv|\.runtime|volumes|uploads|htmlcov)/|\.pyc$|\.log$'; then
            echo "::error::Runtime data, secrets, or build artifacts are tracked"
            exit 1
          fi
      - name: Install
        # The test suite imports fastapi / langchain / pydantic-settings / redis,
        # so the full runtime extras are required, not just [dev].
        run: uv sync --frozen --extra full --extra dev --extra local-embeddings
      - name: Verify lock file
        run: uv lock --check
      - name: Lint
        run: uv run ruff check app aiops_core mcp_servers evaluation tests quickstart.py
      - name: Frontend syntax
        run: node --check static/app.js
      - name: Compose contract
        run: docker compose -f compose.yml --profile full config --quiet
      - name: Offline quickstart smoke
        # The zero-dependency path must keep working without keys or Docker.
        run: uv run python quickstart.py --mode demo
      - name: Test
        run: >
          uv run python -m pytest tests -q
          --junitxml=artifacts/pytest.xml
          --cov-report=json:artifacts/coverage.json
          --cov-fail-under=70

  infrastructure-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --frozen --extra full --extra dev
      - name: Start PostgreSQL and Redis
        run: docker compose -f reliability-stack.yml up -d --wait
      - name: Verify cross-instance state
        env:
          AIOPS_RUN_REDIS_INTEGRATION: "1"
        run: |
          uv run python -m pytest tests/test_coordination.py -q --no-cov
          uv run python evaluation/checkpoint_consistency.py
          uv run python evaluation/redis_coordination_check.py
      - name: Stop infrastructure
        if: always()
        run: docker compose -f reliability-stack.yml down -v
