services:
  checkpoint-postgres:
    image: postgres:15-alpine
    container_name: aiops-checkpoint-postgres
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
      POSTGRES_DB: aiops
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - aiops_checkpoint_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aiops-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - aiops_redis:/data

volumes:
  aiops_checkpoint_postgres:
  aiops_redis:
